<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cerberus Audit Log</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f1117; color: #e1e4e8; padding: 20px; }
  h1 { font-size: 1.4rem; margin-bottom: 16px; color: #58a6ff; }
  .nav-links { margin-bottom: 20px; }
  .nav-links a { color: #58a6ff; text-decoration: none; font-size: 0.85rem; margin-right: 16px; }
  .nav-links a:hover { text-decoration: underline; }
  .filters { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .filters input, .filters select { background: #161b22; border: 1px solid #30363d; color: #e1e4e8; padding: 6px 10px; border-radius: 6px; font-size: 0.85rem; }
  .filters input::placeholder { color: #484f58; }
  .filters button { background: #21262d; border: 1px solid #30363d; color: #e1e4e8; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
  .filters button:hover { background: #30363d; }
  .filters button.active { background: #1f6feb; border-color: #1f6feb; }
  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  th { background: #161b22; color: #8b949e; font-weight: 600; text-transform: uppercase; font-size: 0.72rem; letter-spacing: 0.5px; }
  th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #21262d; white-space: nowrap; }
  tr:hover { background: #161b22; }
  .badge { padding: 2px 8px; border-radius: 10px; font-size: 0.72rem; font-weight: 600; }
  .badge-success { background: #0d4429; color: #3fb950; }
  .badge-error { background: #4a1518; color: #f85149; }
  .badge-rate_limited { background: #4a3012; color: #d29922; }
  .badge-url_mismatch { background: #4a1518; color: #f85149; }
  .badge-exact { background: #0d4429; color: #3fb950; }
  .badge-subdomain { background: #0d3347; color: #58a6ff; }
  .badge-no_uri_configured { background: #3d2e00; color: #d29922; }
  .badge-mismatch { background: #4a1518; color: #f85149; }
  .badge-unknown { background: #21262d; color: #8b949e; }
  .pagination { display: flex; gap: 8px; margin-top: 16px; align-items: center; justify-content: center; }
  .pagination button { background: #21262d; border: 1px solid #30363d; color: #e1e4e8; padding: 4px 12px; border-radius: 6px; cursor: pointer; }
  .pagination button:disabled { opacity: 0.4; cursor: default; }
  .pagination span { color: #8b949e; font-size: 0.85rem; }
  .error-cell { max-width: 200px; overflow: hidden; text-overflow: ellipsis; color: #f85149; }
  .empty { text-align: center; padding: 40px; color: #484f58; }
  /* Login */
  #loginView { max-width: 400px; margin: 80px auto; }
  #loginView h1 { text-align: center; margin-bottom: 24px; }
  .form-group { margin-bottom: 12px; }
  .form-group label { display: block; font-size: 0.82rem; color: #8b949e; margin-bottom: 4px; }
  .form-group input { width: 100%; background: #161b22; border: 1px solid #30363d; color: #e1e4e8; padding: 8px 12px; border-radius: 6px; font-size: 0.9rem; }
  .btn { background: #21262d; border: 1px solid #30363d; color: #e1e4e8; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
  .btn-primary { background: #1f6feb; border-color: #1f6feb; }
  .btn-primary:hover { background: #388bfd; }
  .msg { padding: 10px 14px; border-radius: 6px; margin-bottom: 12px; font-size: 0.85rem; }
  .msg-error { background: #4a1518; color: #f85149; }
</style>
</head>
<body>

<!-- Login View -->
<div id="loginView">
  <h1>Cerberus Audit Log</h1>
  <div id="loginMsg"></div>
  <div class="form-group">
    <label id="loginLabel">Password</label>
    <input type="password" id="loginPassword" placeholder="Enter password..." />
  </div>
  <button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="doLogin()">Login</button>
  <p id="forgotPasswordLink" style="display:none;text-align:center;margin-top:12px;">
    <a href="#" style="color:#8b949e;font-size:0.82rem;text-decoration:none;" onclick="showResetModal()">Forgot password?</a>
  </p>
</div>

<!-- Reset Password Modal -->
<div class="modal-bg" id="resetModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:100;justify-content:center;align-items:center;">
  <div style="background:#161b22;border:1px solid #30363d;border-radius:12px;padding:24px;width:480px;max-width:90vw;">
    <h1 style="font-size:1.1rem;margin-bottom:12px;">Reset Admin Password</h1>
    <p style="font-size:0.85rem;color:#8b949e;margin-bottom:16px;">
      Enter VW_ADMIN_TOKEN from your .env file to reset the admin password.
    </p>
    <div id="resetMsg"></div>
    <div class="form-group">
      <label>VW_ADMIN_TOKEN</label>
      <input type="password" id="resetToken" placeholder="Enter VW_ADMIN_TOKEN..." />
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px;">
      <button class="btn" onclick="hideResetModal()">Cancel</button>
      <button class="btn" id="resetBtn" style="background:#4a1518;border-color:#f85149;color:#f85149;" onclick="doResetPassword()">Reset Password</button>
    </div>
  </div>
</div>

<!-- Main View -->
<div id="mainView" style="display:none">
<h1>Cerberus Audit Log</h1>
<div class="nav-links">
  <a href="/admin">Admin Panel</a>
  <a href="#" onclick="doLogout()">Logout</a>
</div>

<div class="filters">
  <input type="text" id="filterVaultItem" placeholder="Vault item..." />
  <select id="filterResult">
    <option value="">All results</option>
    <option value="success">Success</option>
    <option value="error">Error</option>
    <option value="rate_limited">Rate limited</option>
    <option value="url_mismatch">URL mismatch</option>
  </select>
  <input type="date" id="filterFrom" title="From date" />
  <input type="date" id="filterTo" title="To date" />
  <button onclick="loadPage(1)">Filter</button>
  <button id="autoRefreshBtn" onclick="toggleAutoRefresh()">Auto-refresh: OFF</button>
</div>

<table>
  <thead>
    <tr>
      <th>Timestamp</th>
      <th>Action</th>
      <th>Vault Item</th>
      <th>Username</th>
      <th>URL Match</th>
      <th>Result</th>
      <th>Steps</th>
      <th>Duration</th>
      <th>Error</th>
    </tr>
  </thead>
  <tbody id="logBody"></tbody>
</table>

<div class="pagination">
  <button id="prevBtn" onclick="loadPage(currentPage-1)">Prev</button>
  <span id="pageInfo">-</span>
  <button id="nextBtn" onclick="loadPage(currentPage+1)">Next</button>
</div>
</div>

<script>
let token = sessionStorage.getItem('adminToken') || '';
let currentPage = 1;

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
const perPage = 50;
let autoRefreshInterval = null;

// --- Auth ---

async function initLoginView() {
  try {
    const resp = await fetch('/api/admin/auth-status');
    const data = await resp.json();
    const label = document.getElementById('loginLabel');
    const input = document.getElementById('loginPassword');
    const forgotLink = document.getElementById('forgotPasswordLink');
    if (data.passwordConfigured) {
      label.textContent = 'Password';
      input.placeholder = 'Enter password...';
      forgotLink.style.display = 'block';
    } else {
      label.textContent = 'Admin Token';
      input.placeholder = 'Enter VW_ADMIN_TOKEN...';
      forgotLink.style.display = 'none';
    }
  } catch {}
}

// --- Reset Password ---
function showResetModal() {
  document.getElementById('resetModal').style.display = 'flex';
  document.getElementById('resetMsg').innerHTML = '';
  document.getElementById('resetToken').value = '';
  document.getElementById('resetToken').focus();
}
function hideResetModal() {
  document.getElementById('resetModal').style.display = 'none';
}
async function doResetPassword() {
  const adminToken = document.getElementById('resetToken').value.trim();
  if (!adminToken) {
    document.getElementById('resetMsg').innerHTML = '<div class="msg-error">Please enter VW_ADMIN_TOKEN</div>';
    return;
  }
  const btn = document.getElementById('resetBtn');
  btn.disabled = true;
  try {
    const resp = await fetch('/api/admin/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ adminToken }),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || `HTTP ${resp.status}`);
    hideResetModal();
    document.getElementById('loginMsg').innerHTML = '<div class="msg" style="background:#0d4429;color:#3fb950;">Password reset successful. You can now log in with VW_ADMIN_TOKEN.</div>';
    initLoginView();
  } catch (err) {
    document.getElementById('resetMsg').innerHTML = '<div class="msg-error">' + esc(err.message) + '</div>';
  } finally {
    btn.disabled = false;
  }
}
document.getElementById('resetToken').addEventListener('keydown', e => {
  if (e.key === 'Enter') doResetPassword();
});

function doLogin() {
  const password = document.getElementById('loginPassword').value.trim();
  if (!password) return;
  fetch('/api/admin/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password }),
  }).then(async r => {
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
    token = data.token;
    sessionStorage.setItem('adminToken', token);
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('mainView').style.display = 'block';
    loadPage(1);
  }).catch(err => {
    document.getElementById('loginMsg').innerHTML = '<div class="msg msg-error">Login failed: ' + esc(err.message) + '</div>';
  });
}

function doLogout() {
  fetch('/api/admin/logout', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
  }).catch(() => {});
  sessionStorage.removeItem('adminToken');
  token = '';
  document.getElementById('loginView').style.display = 'block';
  document.getElementById('mainView').style.display = 'none';
  initLoginView();
}

document.getElementById('loginPassword').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

// --- Data ---
function badge(text) {
  if (!text) return '-';
  const s = esc(text);
  return `<span class="badge badge-${s}">${s}</span>`;
}

function formatTs(ts) {
  if (!ts) return '-';
  try {
    const d = new Date(ts + 'Z');
    return d.toLocaleString();
  } catch { return ts; }
}

function formatDuration(ms) {
  if (ms == null) return '-';
  if (ms < 1000) return ms + 'ms';
  return (ms / 1000).toFixed(1) + 's';
}

async function loadPage(page) {
  currentPage = Math.max(1, page);
  const params = new URLSearchParams({ page: currentPage, limit: perPage });
  const vi = document.getElementById('filterVaultItem').value;
  const res = document.getElementById('filterResult').value;
  const from = document.getElementById('filterFrom').value;
  const to = document.getElementById('filterTo').value;
  if (vi) params.set('vaultItem', vi);
  if (res) params.set('result', res);
  if (from) params.set('from', from);
  if (to) params.set('to', to);

  try {
    const resp = await fetch('/api/audit?' + params, {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (resp.status === 401) { doLogout(); return; }
    const data = await resp.json();
    const totalPages = Math.ceil(data.total / perPage) || 1;

    document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages} (${data.total} entries)`;
    document.getElementById('prevBtn').disabled = currentPage <= 1;
    document.getElementById('nextBtn').disabled = currentPage >= totalPages;

    const body = document.getElementById('logBody');
    if (!data.rows || data.rows.length === 0) {
      body.innerHTML = '<tr><td colspan="9" class="empty">No audit entries found</td></tr>';
      return;
    }

    body.innerHTML = data.rows.map(r => `<tr>
      <td>${formatTs(r.timestamp)}</td>
      <td>${esc(r.action) || '-'}</td>
      <td>${esc(r.vault_item) || '-'}</td>
      <td>${esc(r.username) || '-'}</td>
      <td>${r.url_match ? badge(r.url_match) : '-'}</td>
      <td>${badge(r.result)}</td>
      <td>${r.steps_completed != null ? r.steps_completed : '-'}</td>
      <td>${formatDuration(r.duration_ms)}</td>
      <td class="error-cell" title="${esc(r.error)}">${esc(r.error) || '-'}</td>
    </tr>`).join('');
  } catch (err) {
    document.getElementById('logBody').innerHTML = `<tr><td colspan="9" class="empty">Failed to load: ${esc(err.message)}</td></tr>`;
  }
}

function toggleAutoRefresh() {
  const btn = document.getElementById('autoRefreshBtn');
  if (autoRefreshInterval) {
    clearInterval(autoRefreshInterval);
    autoRefreshInterval = null;
    btn.textContent = 'Auto-refresh: OFF';
    btn.classList.remove('active');
  } else {
    autoRefreshInterval = setInterval(() => loadPage(currentPage), 30000);
    btn.textContent = 'Auto-refresh: ON';
    btn.classList.add('active');
  }
}

// --- Init ---
initLoginView();

if (token) {
  fetch('/api/audit?page=1&limit=1', {
    headers: { 'Authorization': 'Bearer ' + token }
  }).then(r => {
    if (!r.ok) throw new Error();
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('mainView').style.display = 'block';
    loadPage(1);
  }).catch(() => {
    sessionStorage.removeItem('adminToken');
    token = '';
  });
}
</script>
</body>
</html>
