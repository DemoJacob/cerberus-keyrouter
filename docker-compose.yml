services:
  # One-shot container to generate self-signed TLS cert for Vaultwarden
  init-certs:
    image: alpine:latest
    command:
      - sh
      - -c
      - |
        if [ -f /certs/cert.pem ] && [ -f /certs/key.pem ]; then
          echo '[init-certs] Certs already exist, skipping'
          exit 0
        fi
        apk add --no-cache openssl
        openssl req -x509 -nodes -days 3650 -newkey rsa:2048 -keyout /certs/key.pem -out /certs/cert.pem -subj '/CN=vaultwarden' -addext 'subjectAltName=DNS:vaultwarden,DNS:localhost'
        echo '[init-certs] Certs generated'
    volumes:
      - certs:/certs

  vaultwarden:
    image: vaultwarden/server:latest
    restart: always
    volumes:
      - ./vw-data:/data
      - certs:/ssl:ro
    environment:
      - SIGNUPS_ALLOWED=true
      - ADMIN_TOKEN=${VW_ADMIN_TOKEN}
      - DOMAIN=https://localhost:8443
      - ROCKET_TLS={certs="/ssl/cert.pem",key="/ssl/key.pem"}
    ports:
      - "0.0.0.0:8443:80"
    depends_on:
      init-certs:
        condition: service_completed_successfully
    networks:
      - secure-net
    healthcheck:
      test: ["CMD", "curl", "-kf", "https://localhost:80/alive"]
      interval: 10s
      timeout: 5s
      retries: 5

  login-router:
    build: ./login-router
    restart: always
    environment:
      # Admin token (protects /admin panel + used for AES encryption of stored passwords)
      - VW_ADMIN_TOKEN=${VW_ADMIN_TOKEN}
      # Default Vaultwarden URL (used when accounts don't override)
      - DEFAULT_VW_URL=https://vaultwarden:80
      # CDP connection
      - CDP_URL=http://host.docker.internal:18800
      - MCP_PORT=8899
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      # Database paths
      - CONFIG_DB_PATH=/app/data/config.db
      - AUDIT_DB_PATH=/app/data/audit.db
      # Rate limiting
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-3}
      - RATE_LIMIT_PER_HOUR=${RATE_LIMIT_PER_HOUR:-20}
      - RATE_LIMIT_COOLDOWN_SECONDS=${RATE_LIMIT_COOLDOWN_SECONDS:-30}
      # Legacy support (auto-migrated on first start, can be removed after)
      - BW_CLIENTID=${BW_CLIENTID:-}
      - BW_CLIENTSECRET=${BW_CLIENTSECRET:-}
      - BW_MASTER_PASSWORD=${BW_MASTER_PASSWORD:-}
    volumes:
      - ./audit-data:/app/data
    ports:
      - "8899:8899"
    depends_on:
      vaultwarden:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - secure-net

volumes:
  certs:

networks:
  secure-net:
    driver: bridge
