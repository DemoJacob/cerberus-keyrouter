services:
  # One-shot container to generate self-signed TLS cert for Vaultwarden
  init-certs:
    image: alpine:latest
    command:
      - sh
      - -c
      - |
        if [ -f /certs/cert.pem ] && [ -f /certs/key.pem ]; then
          echo '[init-certs] Certs already exist, skipping'
          exit 0
        fi
        apk add --no-cache openssl
        openssl req -x509 -nodes -days 3650 -newkey rsa:2048 -keyout /certs/key.pem -out /certs/cert.pem -subj '/CN=vaultwarden' -addext 'subjectAltName=DNS:vaultwarden,DNS:localhost'
        echo '[init-certs] Certs generated'
    volumes:
      - certs:/certs

  vaultwarden:
    image: vaultwarden/server:latest
    restart: always
    volumes:
      - ./vw-data:/data
      - certs:/ssl:ro
    environment:
      - SIGNUPS_ALLOWED=false
      - ADMIN_TOKEN=${VW_ADMIN_TOKEN}
      - DOMAIN=https://localhost:8443
      - ROCKET_TLS={certs="/ssl/cert.pem",key="/ssl/key.pem"}
    ports:
      - "0.0.0.0:8443:80"
    depends_on:
      init-certs:
        condition: service_completed_successfully
    networks:
      - secure-net
    healthcheck:
      test: ["CMD", "curl", "-kf", "https://localhost:80/alive"]
      interval: 10s
      timeout: 5s
      retries: 5

  login-router:
    build: ./login-router
    restart: always
    environment:
      - BW_URL=https://vaultwarden:80
      - BW_CLIENTID=${BW_CLIENTID}
      - BW_CLIENTSECRET=${BW_CLIENTSECRET}
      - BW_MASTER_PASSWORD=${BW_MASTER_PASSWORD}
      - CDP_URL=http://host.docker.internal:18800
      - MCP_PORT=8899
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    ports:
      - "8899:8899"
    depends_on:
      vaultwarden:
        condition: service_healthy
    networks:
      - secure-net

volumes:
  certs:

networks:
  secure-net:
    driver: bridge
